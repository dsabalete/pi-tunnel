services:
  pitunnel:
    image: dsabalete/pitunnel:latest
    container_name: pitunnel
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # NAS disk mount for /status monitoring
      - /mnt/nas:/mnt/nas
      # Mount host root so /status can read SD card usage
      - /:/host:ro
    env_file:
      - ./config/pitunnel.env
    # Raspberry Pi GPIO / I2C access (uncomment if needed)
    # privileged: true
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem
    #   - /dev/i2c-1:/dev/i2c-1
